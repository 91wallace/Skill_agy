<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Termux Web CLI v2</title>
    
    <!-- Manifesto PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0b0f19">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="folder_1250635.png">
    
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Marked.js & DOMPurify -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
    <!-- XTerm.js Local -->
    <link rel="stylesheet" href="xterm.css">
    <script src="xterm.js"></script>
    <script src="xterm-addon-fit.js"></script>
    <!-- Custom Theme & Tokens -->
    <link rel="stylesheet" href="css/theme.css">
</head>
<body class="bg-[#0b0f19] text-gray-100 flex flex-col font-mono overflow-hidden app-container select-none">

    <!-- Cabeçalho Superior com Abas Integradas -->
    <header class="bg-[#0e1320] px-3 pt-2 pb-0 flex items-center justify-between border-b border-white/[0.08] z-10 shrink-0 select-none gap-2">
        <div class="flex items-center gap-1 overflow-x-auto no-scrollbar flex-1 min-w-0">
            <div id="tabs-list" class="flex items-end gap-1.5 flex-shrink-0">
                <!-- Abas dinâmicas -->
            </div>
            <button id="btn-add-tab" type="button" class="text-gray-400 hover:text-emerald-400 p-1.5 rounded-lg text-xs font-bold shrink-0 flex items-center justify-center active:scale-90 transition-all ml-1 mb-1 hover:bg-white/[0.05]" title="Nova Aba Terminal (+)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path>
                </svg>
            </button>
            <button id="btn-add-agy-tab" type="button" class="text-indigo-400 hover:text-indigo-300 bg-indigo-950/40 hover:bg-indigo-900/60 border border-indigo-500/30 px-2 py-1 rounded-lg text-xs font-semibold shrink-0 flex items-center gap-1 active:scale-90 transition-all ml-1 mb-1 shadow-sm" title="Nova Aba Antigravity IA">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                <span>+ AGY</span>
            </button>
        </div>

        <!-- Status de Conexão -->
        <div id="status-indicator" class="flex items-center text-xs shrink-0 pl-2 mb-1">
            <span class="w-2 h-2 rounded-full bg-amber-400 mr-1.5 animate-pulse" id="status-dot"></span>
            <span id="status-text" class="text-gray-400 text-[11px] hidden sm:inline">Conectando...</span>
        </div>
    </header>

    <!-- Área Principal do Terminal -->
    <main id="terminal-container" class="flex-1 overflow-y-auto p-2.5 flex flex-col relative select-text">
        
        <!-- Barra de Comandos Anteriores (Histórico Expansível) -->
        <div id="past-commands-bar" class="hidden shrink-0 flex-col bg-[#111827]/90 border border-white/[0.08] rounded-xl mb-2 text-xs transition-all shadow-lg backdrop-blur-md">
            <div id="past-commands-header" class="flex items-center justify-between px-3 py-2 cursor-pointer select-none text-gray-400 hover:text-gray-200 transition-colors min-h-[36px]">
                <div class="flex items-center gap-2 min-w-0 flex-1 truncate">
                    <span id="past-commands-latest-text" class="truncate font-mono text-[12px] text-gray-200 flex-1"></span>
                </div>
                <button id="btn-toggle-past-commands" type="button" class="text-gray-400 hover:text-white p-1 ml-2 rounded-lg hover:bg-white/[0.08] transition-transform flex items-center justify-center" title="Ver comandos anteriores">
                    <svg class="past-chevron w-4 h-4 transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path>
                    </svg>
                </button>
            </div>
            <div id="past-commands-list" class="hidden max-h-52 overflow-y-auto border-t border-white/[0.06] p-2 flex flex-col gap-1 font-mono text-xs"></div>
        </div>

        <!-- Fluxo de Saída do Terminal -->
        <div id="terminal-output" class="whitespace-pre-wrap word-break leading-relaxed pb-2 flex flex-col gap-1.5"></div>

        <!-- Linha de Comando Incorporada (Prompt) -->
        <div id="command-container" role="search" class="flex items-center gap-2 py-2 px-1.5 pb-4 w-full font-mono text-xs sm:text-sm shrink-0 border-t border-white/[0.06] mt-auto">
            <div class="flex items-center gap-1.5 shrink-0 select-none cursor-pointer group" title="Clique para abrir o explorador de arquivos">
                <span id="prompt-cwd-text" class="text-amber-400 group-hover:underline font-semibold prompt-line">~</span>
                <span class="text-emerald-400 font-bold">$</span>
            </div>
            <input type="search" id="command-input" class="flex-1 min-w-0 bg-transparent border-none text-gray-100 placeholder-gray-600 focus:outline-none focus:ring-0 text-xs sm:text-sm font-mono p-0" placeholder="digite um comando..." autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false" inputmode="text" enterkeyhint="go">
            <button id="btn-run" type="button" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-1.5 rounded-lg text-xs font-bold active:scale-95 transition-all shrink-0 shadow-md flex items-center gap-1">
                <span>Executar</span>
            </button>
        </div>

        <!-- Árvore de Diretórios Flutuante (Explorer) -->
        <div id="directory-tree-panel" class="hidden absolute top-2 left-2 right-2 max-w-lg mx-auto bg-[#111827]/95 border border-white/[0.12] rounded-2xl shadow-2xl p-3 transition-all text-xs z-30 backdrop-blur-xl">
            <div class="flex justify-between items-center pb-2.5 border-b border-white/[0.08] text-[12px] text-gray-300 font-sans">
                <div class="flex items-center gap-1.5 truncate">
                    <button id="btn-tree-up" type="button" class="text-gray-400 hover:text-amber-400 hover:bg-white/[0.08] p-1.5 rounded-lg transition-colors flex items-center justify-center font-bold" title="Subir diretório (cd ..)">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                        </svg>
                    </button>
                    <svg class="tree-dir-icon w-4 h-4 fill-currentColor text-amber-400 shrink-0" viewBox="0 0 20 20">
                        <path d="M2 6a2 2 0 012-2h5l2 2h5a2 2 0 012 2v6a2 2 0 01-2 2H4a2 2 0 01-2-2V6z"></path>
                    </svg>
                    <span id="tree-current-cwd" class="text-gray-100 font-mono truncate font-medium">~</span>
                </div>
                <button id="btn-close-dir-tree" type="button" class="text-gray-400 hover:text-white hover:bg-white/[0.08] w-7 h-7 rounded-lg flex items-center justify-center font-bold text-lg leading-none transition-colors active:scale-90" title="Fechar">&times;</button>
            </div>
            <div id="directory-tree-content" class="flex flex-col gap-1 pt-2.5 max-h-64 overflow-y-auto"></div>
        </div>

        <!-- Painel de Opções Interativas (Múltipla Escolha / Prompts) -->
        <div id="interactive-options-panel" class="hidden bg-[#111827]/95 border border-indigo-500/40 rounded-2xl shadow-2xl p-3.5 my-2 flex flex-col gap-2.5 transition-all text-xs backdrop-blur-xl">
            <div class="flex justify-between items-center pb-2 border-b border-white/[0.08] text-xs font-sans">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                    <span id="options-panel-title" class="text-indigo-200 font-bold">Selecione uma opção:</span>
                </div>
                <div id="options-timer-badge" class="flex items-center gap-1.5 bg-indigo-950/80 border border-indigo-500/30 px-2 py-0.5 rounded-full text-indigo-300 text-[11px] font-mono">
                    <span>Opções prontas</span>
                </div>
            </div>
            <div id="options-timer-progress-bg" class="hidden w-full bg-gray-800 rounded-full h-1 overflow-hidden">
                <div id="options-timer-progress-bar" class="bg-indigo-500 h-full w-full transition-all duration-100 ease-linear"></div>
            </div>
            <div id="interactive-options-list" class="flex flex-col gap-1.5 pt-1"></div>
        </div>
    </main>

    <!-- Barra de Ferramentas e Ações Rápidas (Thumb-Zone) -->
    <footer class="bg-[#0e1320]/95 backdrop-blur-xl border-t border-white/[0.08] flex items-center gap-2 z-10 shrink-0 footer-safe select-none">
        <div class="flex gap-2 overflow-x-auto pb-0.5 no-scrollbar items-center w-full">
            <button id="btn-ssh-toggle" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-3 py-2 rounded-xl whitespace-nowrap active:scale-95 transition-all flex items-center gap-1.5 font-semibold shadow-md">
                <svg class="w-3.5 h-3.5 fill-none stroke-currentColor shrink-0" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path>
                </svg>
                <span>SSH</span>
            </button>
            <button id="btn-snippets-toggle" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-3 py-2 rounded-xl whitespace-nowrap active:scale-95 transition-all flex items-center gap-1.5 font-semibold shadow-md">
                <svg class="w-3.5 h-3.5 fill-none stroke-currentColor shrink-0" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                </svg>
                <span>Snippets</span>
            </button>
            <button id="btn-clipboard-toggle" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-3 py-2 rounded-xl whitespace-nowrap active:scale-95 transition-all flex items-center gap-1.5 font-semibold shadow-md">
                <svg class="w-3.5 h-3.5 fill-none stroke-currentColor shrink-0" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                </svg>
                <span>Clipboard</span>
            </button>
            <button id="btn-cancel" class="bg-rose-950/80 hover:bg-rose-900 text-rose-300 border border-rose-500/30 text-xs px-3 py-2 rounded-xl whitespace-nowrap active:scale-95 transition-all font-medium flex items-center gap-1.5 shadow-sm">
                <svg class="w-3.5 h-3.5 fill-none stroke-currentColor shrink-0 text-rose-400" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
                <span>Cancelar (Ctrl+C)</span>
            </button>
            <button class="shortcut-btn bg-white/[0.06] hover:bg-white/[0.12] text-gray-200 text-xs px-3 py-2 rounded-xl whitespace-nowrap active:scale-95 transition-all border border-white/[0.08] flex items-center gap-1.5 font-medium shadow-sm" data-cmd="ls -la">
                <svg class="w-3.5 h-3.5 fill-none stroke-currentColor text-amber-400 shrink-0" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                </svg>
                <span>ls -la</span>
            </button>
            <button class="shortcut-btn bg-white/[0.06] hover:bg-white/[0.12] text-gray-200 text-xs px-3 py-2 rounded-xl whitespace-nowrap active:scale-95 transition-all border border-white/[0.08] flex items-center gap-1.5 font-medium shadow-sm" data-cmd="top -n 1">
                <svg class="w-3.5 h-3.5 fill-none stroke-currentColor text-cyan-400 shrink-0" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
                <span>top</span>
            </button>
            <button class="shortcut-btn bg-white/[0.06] hover:bg-white/[0.12] text-gray-200 text-xs px-3 py-2 rounded-xl whitespace-nowrap active:scale-95 transition-all border border-white/[0.08] flex items-center gap-1.5 font-medium shadow-sm" data-cmd="git status">
                <svg class="w-3.5 h-3.5 fill-none stroke-currentColor text-orange-400 shrink-0" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path>
                </svg>
                <span>git status</span>
            </button>
            <button id="btn-settings-toggle" class="bg-white/[0.06] hover:bg-white/[0.12] text-gray-200 hover:text-white text-xs w-9 h-9 rounded-xl shrink-0 active:scale-95 transition-all flex items-center justify-center ml-auto border border-white/[0.08] shadow-sm" title="Configurações">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </div>
    </footer>

    <!-- Modais & Bottom Sheets -->

    <!-- Modal SSH -->
    <div id="ssh-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-end hidden opacity-0 transition-opacity duration-300">
        <div id="ssh-backdrop" class="flex-1"></div>
        <div class="bg-[#111827] border-t border-emerald-500/40 rounded-t-3xl shadow-2xl flex flex-col max-h-[90vh] w-full transform translate-y-full transition-transform duration-300 ease-out" id="ssh-sheet">
            <div class="p-3.5 border-b border-white/[0.08] flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01"></path></svg>
                    <span class="text-gray-100 font-bold text-sm">Conexões SSH Remotas</span>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-toggle-add-ssh" class="bg-emerald-600 hover:bg-emerald-500 text-white text-xs px-2.5 py-1.5 rounded-lg active:scale-95 transition-all font-medium flex items-center gap-1">
                        <span>+ Novo Host</span>
                    </button>
                    <button id="btn-close-ssh" class="text-gray-400 hover:text-white p-1 rounded-lg text-lg leading-none">&times;</button>
                </div>
            </div>
            <div id="ssh-form-container" class="hidden p-3 bg-[#1e293b]/80 border-b border-white/[0.08] flex flex-col gap-2.5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                    <input type="text" id="ssh-label-input" placeholder="Nome / Rótulo" class="bg-[#0b0f19] border border-white/[0.12] rounded-xl px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-emerald-500 col-span-1 sm:col-span-2">
                    <input type="text" id="ssh-host-input" placeholder="Host / IP" class="bg-[#0b0f19] border border-white/[0.12] rounded-xl px-3 py-2 text-xs font-mono text-gray-100 focus:outline-none focus:border-emerald-500">
                    <div class="flex gap-2">
                        <input type="number" id="ssh-port-input" value="22" placeholder="Porta" class="w-20 bg-[#0b0f19] border border-white/[0.12] rounded-xl px-2.5 py-2 text-xs font-mono text-gray-100 focus:outline-none focus:border-emerald-500">
                        <input type="text" id="ssh-user-input" value="root" placeholder="Usuário" class="flex-1 bg-[#0b0f19] border border-white/[0.12] rounded-xl px-3 py-2 text-xs font-mono text-gray-100 focus:outline-none focus:border-emerald-500">
                    </div>
                </div>
                <div class="flex items-center gap-4 text-xs pt-1 text-gray-300">
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="radio" name="ssh-auth-type" value="password" checked class="text-emerald-500">
                        <span>Senha</span>
                    </label>
                    <label class="flex items-center gap-1.5 cursor-pointer">
                        <input type="radio" name="ssh-auth-type" value="key" class="text-emerald-500">
                        <span>Chave Privada</span>
                    </label>
                </div>
                <div id="ssh-auth-password-field" class="flex flex-col gap-1">
                    <input type="password" id="ssh-password-input" placeholder="Senha do SSH" class="bg-[#0b0f19] border border-white/[0.12] rounded-xl px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-emerald-500">
                </div>
                <div id="ssh-auth-key-field" class="hidden flex flex-col gap-1">
                    <textarea id="ssh-key-input" rows="3" placeholder="-----BEGIN OPENSSH PRIVATE KEY-----..." class="bg-[#0b0f19] border border-white/[0.12] rounded-xl px-3 py-2 text-xs font-mono text-gray-100 focus:outline-none focus:border-emerald-500"></textarea>
                </div>
                <div class="flex items-center justify-between pt-1">
                    <button id="btn-cancel-ssh-form" class="text-xs px-3 py-1.5 rounded-xl bg-white/[0.08] hover:bg-white/[0.15] text-gray-300">Cancelar</button>
                    <div class="flex items-center gap-2">
                        <button id="btn-save-ssh-profile" class="text-xs px-3 py-1.5 rounded-xl bg-white/[0.08] hover:bg-white/[0.15] text-emerald-300 border border-emerald-500/40 font-medium">Salvar Perfil</button>
                        <button id="btn-connect-ssh-direct" class="text-xs px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold">Conectar</button>
                    </div>
                </div>
            </div>
            <div id="ssh-profiles-list" class="overflow-y-auto p-3 flex flex-col gap-2 min-h-[140px]"></div>
        </div>
    </div>

    <!-- Modal Snippets -->
    <div id="snippets-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-end hidden opacity-0 transition-opacity duration-300">
        <div id="snippets-backdrop" class="flex-1"></div>
        <div class="bg-[#111827] border-t border-blue-500/40 rounded-t-3xl shadow-2xl flex flex-col max-h-[85vh] w-full transform translate-y-full transition-transform duration-300 ease-out" id="snippets-sheet">
            <div class="p-3.5 border-b border-white/[0.08] flex justify-between items-center">
                <span class="text-gray-100 font-bold text-sm">Comandos Rápidos (Snippets)</span>
                <div class="flex items-center gap-2">
                    <button id="btn-toggle-add-snippet" class="bg-blue-600 hover:bg-blue-500 text-white text-xs px-2.5 py-1.5 rounded-lg active:scale-95 transition-all font-medium">+ Novo</button>
                    <button id="btn-close-snippets" class="text-gray-400 hover:text-white p-1 rounded-lg text-lg leading-none">&times;</button>
                </div>
            </div>
            <div id="snippet-form-container" class="hidden p-3 bg-[#1e293b]/80 border-b border-white/[0.08] flex flex-col gap-2">
                <input type="text" id="snippet-name-input" placeholder="Nome" class="bg-[#0b0f19] border border-white/[0.12] rounded-xl px-3 py-2 text-xs text-gray-100 focus:outline-none focus:border-blue-500">
                <input type="text" id="snippet-cmd-input" placeholder="Comando" class="bg-[#0b0f19] border border-white/[0.12] rounded-xl px-3 py-2 text-xs font-mono text-gray-100 focus:outline-none focus:border-blue-500">
                <div class="flex justify-end gap-2 mt-1">
                    <button id="btn-cancel-add-snippet" class="text-xs px-3 py-1.5 rounded-xl bg-white/[0.08] text-gray-300">Cancelar</button>
                    <button id="btn-save-snippet" class="text-xs px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-500 text-white font-semibold">Salvar</button>
                </div>
            </div>
            <div id="snippets-list" class="overflow-y-auto p-3 flex flex-col gap-2"></div>
        </div>
    </div>

    <!-- Modal Clipboard -->
    <div id="clipboard-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex flex-col justify-end hidden opacity-0 transition-opacity duration-300">
        <div id="clipboard-backdrop" class="flex-1"></div>
        <div class="bg-[#111827] border-t border-purple-500/40 rounded-t-3xl shadow-2xl flex flex-col max-h-[85vh] w-full transform translate-y-full transition-transform duration-300 ease-out" id="clipboard-sheet">
            <div class="p-3.5 border-b border-white/[0.08] flex justify-between items-center">
                <span class="text-gray-100 font-bold text-sm">Histórico do Clipboard</span>
                <div class="flex items-center gap-2">
                    <button id="btn-clipboard-sync" class="bg-purple-600 hover:bg-purple-500 text-white text-xs px-2.5 py-1.5 rounded-lg active:scale-95 transition-all font-medium">Sincronizar</button>
                    <button id="btn-clipboard-clear-all" class="bg-rose-900/80 hover:bg-rose-800 text-rose-200 text-xs px-2.5 py-1.5 rounded-lg active:scale-95 transition-all font-medium">Limpar</button>
                    <button id="btn-close-clipboard" class="text-gray-400 hover:text-white p-1 rounded-lg text-lg leading-none">&times;</button>
                </div>
            </div>
            <div id="clipboard-list" class="overflow-y-auto p-3 flex flex-col gap-2"></div>
        </div>
    </div>

    <!-- Modal Configurações & Cores -->
    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-200">
        <div id="settings-backdrop" class="absolute inset-0"></div>
        <div class="bg-[#111827] border border-white/[0.12] rounded-3xl shadow-2xl flex flex-col w-full max-w-sm z-10 overflow-hidden transform scale-95 transition-transform duration-200" id="settings-card">
            <div class="p-4 border-b border-white/[0.08] flex justify-between items-center">
                <span class="text-gray-100 font-bold text-sm">Personalização</span>
                <button id="btn-close-settings" class="text-gray-400 hover:text-white p-1 rounded-lg text-lg leading-none">&times;</button>
            </div>
            <div class="p-4 flex flex-col gap-4 overflow-y-auto max-h-[70vh] text-xs">
                <!-- Toggle: Mostrar Arquivos Ocultos -->
                <div class="flex items-center justify-between p-3 bg-white/[0.04] border border-white/[0.06] rounded-2xl">
                    <div class="flex flex-col">
                        <span class="text-gray-200 font-medium">Arquivos Ocultos</span>
                        <span class="text-gray-400 text-[11px]">Exibir arquivos iniciados com .</span>
                    </div>
                    <label class="relative inline-flex items-center cursor-pointer">
                        <input type="checkbox" id="toggle-show-hidden" class="sr-only peer">
                        <div class="w-9 h-5 bg-gray-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-4 after:w-4 after:transition-all peer-checked:bg-emerald-500"></div>
                    </label>
                </div>

                <!-- Cores Prompt -->
                <div class="flex flex-col gap-2 p-3 bg-white/[0.04] border border-white/[0.06] rounded-2xl">
                    <span class="text-gray-200 font-semibold">Linha de Comando (Prompt)</span>
                    <div class="flex items-center gap-2 pt-1 flex-wrap" id="swatches-prompt">
                        <button type="button" class="color-swatch-btn" data-color="#facc15" style="background-color: #facc15;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#10b981" style="background-color: #10b981;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#06b6d4" style="background-color: #06b6d4;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#3b82f6" style="background-color: #3b82f6;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#ef4444" style="background-color: #ef4444;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#c084fc" style="background-color: #c084fc;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#f3f4f6" style="background-color: #f3f4f6;"></button>
                    </div>
                </div>

                <!-- Cores Diretórios -->
                <div class="flex flex-col gap-2 p-3 bg-white/[0.04] border border-white/[0.06] rounded-2xl">
                    <span class="text-gray-200 font-semibold">Pastas / Diretórios</span>
                    <div class="flex items-center gap-2 pt-1 flex-wrap" id="swatches-dirs">
                        <button type="button" class="color-swatch-btn" data-color="#facc15" style="background-color: #facc15;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#10b981" style="background-color: #10b981;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#06b6d4" style="background-color: #06b6d4;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#3b82f6" style="background-color: #3b82f6;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#ef4444" style="background-color: #ef4444;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#c084fc" style="background-color: #c084fc;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#f3f4f6" style="background-color: #f3f4f6;"></button>
                    </div>
                </div>

                <!-- Cores Arquivos -->
                <div class="flex flex-col gap-2 p-3 bg-white/[0.04] border border-white/[0.06] rounded-2xl">
                    <span class="text-gray-200 font-semibold">Arquivos</span>
                    <div class="flex items-center gap-2 pt-1 flex-wrap" id="swatches-files">
                        <button type="button" class="color-swatch-btn" data-color="#9ca3af" style="background-color: #9ca3af;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#f3f4f6" style="background-color: #f3f4f6;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#06b6d4" style="background-color: #06b6d4;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#10b981" style="background-color: #10b981;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#ef4444" style="background-color: #ef4444;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#facc15" style="background-color: #facc15;"></button>
                        <button type="button" class="color-swatch-btn" data-color="#c084fc" style="background-color: #c084fc;"></button>
                    </div>
                </div>

                <button id="btn-reset-colors" type="button" class="w-full py-2.5 bg-white/[0.08] hover:bg-white/[0.14] text-gray-300 rounded-2xl font-medium text-xs transition-colors">Restaurar Padrões</button>
            </div>
        </div>
    </div>

    <!-- ES Module Main Entry -->
    <script type="module" src="js/main.js"></script>
</body>
</html>
